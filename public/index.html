<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rucha — Demo Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 class="logo">Rucha</h1>
      <p class="subtitle">CI/CD practice — Static Login Demo</p>

      <form id="loginForm" class="form" autocomplete="off" novalidate>
        <label>
          <span>Username</span>
          <input id="username" name="username" type="text" required />
        </label>

        <label>
          <span>Password</span>
          <input id="password" name="password" type="password" required />
        </label>

        <div class="actions">
          <button id="submitBtn" type="submit">Sign In</button>
        </div>

        <div id="message" class="message" aria-live="polite"></div>
      </form>

      <p class="hint">Use <strong>admin</strong> / <strong>password</strong> to sign in.</p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
